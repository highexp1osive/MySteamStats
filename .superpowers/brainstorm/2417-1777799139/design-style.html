<h2>页面设计风格方案</h2>
<p class="subtitle">选择统一的视觉语言方向</p>

<div class="options">
  <div class="option" data-choice="gaming-dark">
    <div class="letter">A</div>
    <div class="content">
      <h3>游戏终端暗色</h3>
      <p>深色背景 + 高饱和橙色点缀 + 霓虹光效</p>
      <div style="display:flex;gap:8px;margin-top:8px;">
        <div style="width:24px;height:24px;background:#0a0a0f;border-radius:4px;border:1px solid #333;"></div>
        <div style="width:24px;height:24px;background:#ff6b35;border-radius:4px;"></div>
        <div style="width:24px;height:24px;background:#1a1a2e;border-radius:4px;"></div>
        <div style="width:24px;height:24px;background:#f0f0f0;border-radius:4px;"></div>
      </div>
      <p style="font-size:13px;color:#888;margin-top:8px;">深邃太空感，橙色作为唯一强调色，像游戏终端界面</p>
    </div>
  </div>
  <div class="option" data-choice="steam-blue">
    <div class="letter">B</div>
    <div class="content">
      <h3>Steam 风格延续</h3>
      <p>Steam 经典深蓝灰 + 蓝色调，延续 Steam 用户心智</p>
      <div style="display:flex;gap:8px;margin-top:8px;">
        <div style="width:24px;height:24px;background:#171a21;border-radius:4px;"></div>
        <div style="width:24px;height:24px;background:#1a9fff;border-radius:4px;"></div>
        <div style="width:24px;height:24px;background:#2a475e;border-radius:4px;"></div>
        <div style="width:24px;height:24px;background:#c7d5e0;border-radius:4px;"></div>
      </div>
      <p style="font-size:13px;color:#888;margin-top:8px;">和 Steam 一致的配色，用户从 Steam 跳过来体验无缝</p>
    </div>
  </div>
  <div class="option" data-choice="minimal-light">
    <div class="letter">C</div>
    <div class="content">
      <h3>极简亮色</h3>
      <p>浅色背景 + 紫色渐变点缀 + 大面积留白</p>
      <div style="display:flex;gap:8px;margin-top:8px;">
        <div style="width:24px;height:24px;background:#ffffff;border-radius:4px;border:1px solid #ddd;"></div>
        <div style="width:24px;height:24px;background:#7c3aed;border-radius:4px;"></div>
        <div style="width:24px;height:24px;background:#f5f3ff;border-radius:4px;"></div>
        <div style="width:24px;height:24px;background:#1e1b4b;border-radius:4px;"></div>
      </div>
      <p style="font-size:13px;color:#888;margin-top:8px;">干净现代的数据仪表盘风格，但和 Steam 游戏调性略不同</p>
    </div>
  </div>
</div>
